<template>
    <div class="logs-shell">

        <div class="logs-header">
            <lightning-button-icon icon-name="utility:back" alternative-text="Back" onclick={handleBack}></lightning-button-icon>
            <span class="logs-title">Execution logs</span>
            <div class="spacer"></div>
            <lightning-combobox
                value=""
                options={statusOptions}
                variant="label-hidden"
                placeholder="Filter by status"
                onchange={handleFilterStatus}
                class="filter-combo">
            </lightning-combobox>
            <lightning-button label="Export CSV" icon-name="utility:download"></lightning-button>
        </div>

        <div class="logs-body">

            <!-- TABLE -->
            <div class="logs-table-wrap">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Agent</th>
                            <th>Department</th>
                            <th>Record ID</th>
                            <th>Score</th>
                            <th>Priority</th>
                            <th>Tools used</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={logs} for:item="log">
                            <tr key={log.Id} data-id={log.Id} onclick={handleRowClick} class="log-row">
                                <td>
                                    <span class={log.statusClass}></span>
                                </td>
                                <td class="td-agent">{log.agentName}</td>
                                <td class="td-dept">{log.department}</td>
                                <td class="td-mono">{log.RecordId__c}</td>
                                <td>
                                    <span style={log.scoreStyle}>{log.AgentScore__c}</span>
                                </td>
                                <td>{log.AgentPriority__c}</td>
                                <td class="td-tools">{log.ToolsUsed__c}</td>
                                <td>
                                    <lightning-badge
                                        label={log.Status__c}
                                        class={log.statusBadgeClass}>
                                    </lightning-badge>
                                </td>
                                <td class="td-date">{log.formattedDate}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <template lwc:if={noLogs}>
                    <div class="empty-logs">
                        <lightning-icon icon-name="utility:list" size="medium" alternative-text="No logs"></lightning-icon>
                        <p>No executions yet. Run an agent to see results here.</p>
                    </div>
                </template>
            </div>

            <!-- PAGINATION -->
            <div class="logs-pagination">
                <lightning-button
                    label="Previous"
                    icon-name="utility:chevronleft"
                    disabled={prevDisabled}
                    onclick={handlePrevPage}>
                </lightning-button>
                <span class="page-info">{pageInfo}</span>
                <lightning-button
                    label="Next"
                    icon-name="utility:chevronright"
                    icon-position="right"
                    disabled={nextDisabled}
                    onclick={handleNextPage}>
                </lightning-button>
            </div>
        </div>

        <!-- DETAIL PANEL -->
        <template lwc:if={selectedLog}>
            <div class="detail-overlay" onclick={handleCloseDetail}></div>
            <div class="detail-panel">
                <div class="detail-head">
                    <span class="detail-title">Execution detail</span>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseDetail}></lightning-button-icon>
                </div>
                <div class="detail-body">
                    <div class="detail-row"><span class="dr-key">Agent</span><span class="dr-val">{selectedLog.agentName}</span></div>
                    <div class="detail-row"><span class="dr-key">Correlation ID</span><span class="dr-val dr-mono">{selectedLog.CorrelationId__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Record ID</span><span class="dr-val dr-mono">{selectedLog.RecordId__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Score</span><span class="dr-val">{selectedLog.AgentScore__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Priority</span><span class="dr-val">{selectedLog.AgentPriority__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Status</span><span class="dr-val">{selectedLog.Status__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Tools used</span><span class="dr-val">{selectedLog.ToolsUsed__c}</span></div>
                    <div class="detail-row"><span class="dr-key">Date</span><span class="dr-val">{selectedLog.formattedDate}</span></div>
                    <div class="detail-section">Reasoning</div>
                    <div class="detail-reason">{selectedLog.AgentReason__c}</div>
                    <div class="detail-section">Output payload</div>
                    <pre class="detail-json">{selectedLog.OutputPayload__c}</pre>
                </div>
            </div>
        </template>

    </div>
</template>
