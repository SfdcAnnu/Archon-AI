<template>
    <template lwc:if={open}>
        <div class="kbm-backdrop" onclick={handleClose}></div>
        <section role="dialog" aria-modal="true" aria-labelledby="kbm-heading" class="kbm-modal" onclick={stop}>
            <header class="kbm-head">
                <h2 id="kbm-heading">Knowledge base — {agentName}</h2>
                <lightning-button-icon icon-name="utility:close" size="small" variant="bare" alternative-text="Close" onclick={handleClose}></lightning-button-icon>
            </header>

            <div class="kbm-tabs">
                <div class={notesTabClass} data-tab="notes" onclick={handleTabClick}>Notes</div>
                <div class={documentsTabClass} data-tab="documents" onclick={handleTabClick}>Documents</div>
            </div>

            <div class="kbm-body">
                <!-- ══ NOTES TAB ══ -->
                <template lwc:if={isNotesTab}>
                    <lightning-textarea
                        label="Business rules and knowledge"
                        value={notesValue}
                        rows="14"
                        placeholder="Write your agent's rules in plain English. Example: Hot leads (score > 80) must be assigned to the AE via Slack."
                        onchange={handleNotesChange}>
                    </lightning-textarea>
                    <div class="kbm-hint">Always included in full, every call — good for short rules. For longer reference material (FAQs, policy docs), use the Documents tab: those get retrieved by relevance instead of pasted in full each time.</div>
                </template>

                <!-- ══ DOCUMENTS TAB ══ -->
                <template lwc:if={isDocumentsTab}>
                    <template lwc:if={canManageDocuments}>

                        <div class="kbm-section">
                            <div class="kbm-section-title">Where should documents be stored?</div>
                            <div class="kbm-backend-rows">
                                <template for:each={backendRows} for:item="b">
                                    <div key={b.value} class={b.rowClass} data-value={b.value} onclick={handleBackendSelect}>
                                        <span class={b.radioClass}></span>
                                        <div class="kbm-backend-text">
                                            <div class="kbm-backend-label">{b.label}</div>
                                            <div class="kbm-backend-hint">{b.hint}</div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <template lwc:if={showConnectionUrlField}>
                                <div class="kbm-conn-row">
                                    <lightning-input
                                        type="password"
                                        label="Postgres connection string"
                                        placeholder="postgresql://user:password@host:5432/dbname"
                                        value={_connectionUrlInput}
                                        onchange={handleConnectionUrlChange}>
                                    </lightning-input>
                                    <template lwc:if={_storageConfig.connectionUrlMasked}>
                                        <div class="kbm-hint">Currently connected: {_storageConfig.connectionUrlMasked}</div>
                                    </template>
                                    <lightning-button label="Test connection" onclick={handleTestConnection} disabled={_testingConnection} class="kbm-test-btn"></lightning-button>
                                    <template lwc:if={_testResult}>
                                        <div class={testResultClass}>{_testResult.message}</div>
                                    </template>
                                </div>
                            </template>
                            <lightning-button variant="brand" label="Save storage backend" onclick={handleSaveBackend} disabled={_savingBackend} class="kbm-save-backend-btn"></lightning-button>
                        </div>

                        <div class="kbm-section">
                            <div class="kbm-section-title">Documents</div>
                            <template lwc:if={_docsLoading}>
                                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                            </template>
                            <template lwc:elseif={_docsError}>
                                <div class="kbm-error">{_docsError}</div>
                            </template>
                            <template lwc:else>
                                <template lwc:if={noDocuments}>
                                    <div class="kbm-hint">No documents yet — add one below.</div>
                                </template>
                                <template for:each={documentRows} for:item="d">
                                    <div key={d.id} class="kbm-doc-row">
                                        <div class="kbm-doc-text">
                                            <div class="kbm-doc-title">{d.title}</div>
                                            <div class="kbm-doc-meta">
                                                <span class={d.badgeClass}>{d.status}</span>
                                                <span class="kbm-doc-chunks">{d.chunkLabel}</span>
                                            </div>
                                            <template lwc:if={d.errorMessage}>
                                                <div class="kbm-doc-error">{d.errorMessage}</div>
                                            </template>
                                        </div>
                                        <lightning-button-icon icon-name="utility:refresh" variant="bare" size="small" alternative-text="Reindex" data-id={d.id} onclick={handleReindexDocument}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" variant="bare" size="small" alternative-text="Delete" data-id={d.id} onclick={handleDeleteDocument}></lightning-button-icon>
                                    </div>
                                </template>
                            </template>
                        </div>

                        <div class="kbm-section">
                            <div class="kbm-section-title">Add a document</div>
                            <lightning-input label="Title" value={_newDocTitle} onchange={handleNewTitleChange} class="kbm-field-space"></lightning-input>
                            <lightning-textarea label="Text" rows="6" value={_newDocText} placeholder="Paste the document's text content here." onchange={handleNewTextChange} class="kbm-field-space"></lightning-textarea>
                            <template lwc:if={_uploadError}>
                                <div class="kbm-error">{_uploadError}</div>
                            </template>
                            <lightning-button variant="brand" label="Add document" onclick={handleAddDocument} disabled={addDocumentDisabled} class="kbm-add-btn"></lightning-button>
                        </div>

                    </template>
                    <template lwc:else>
                        <div class="kbm-hint">This agent isn't saved yet, so documents have nothing to attach to. Close this and give the agent a name — reopening Knowledge Base will save it automatically.</div>
                    </template>
                </template>
            </div>

            <footer class="kbm-foot">
                <lightning-button variant="brand" label="Done" onclick={handleClose}></lightning-button>
            </footer>
        </section>
    </template>
</template>
