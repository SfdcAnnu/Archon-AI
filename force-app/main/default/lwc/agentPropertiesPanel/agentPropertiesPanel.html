<template>
    <div class="props-wrap">

        <!-- ── Header ─────────────────────────────────────── -->
        <div class="rp-head">
            <div class={headIconClass}>
                <lightning-icon icon-name={headIcon} size="x-small" alternative-text={nodeTitle}></lightning-icon>
            </div>
            <div class="rp-meta">
                <div class="rp-title">{nodeTitle}</div>
                <div class="rp-sub">{headSubtitle}</div>
            </div>
        </div>

        <div class="rp-body">

            <!-- Credential warning (AI nodes without a bound key) -->
            <template lwc:if={showKeyAlert}>
                <div class="alert-w">
                    <lightning-icon icon-name="utility:warning" size="xx-small"></lightning-icon>
                    <span>API key required — add a {engineDisplayName} key to activate this node.</span>
                </div>
            </template>

            <!-- ── Tabs ───────────────────────────────────── -->
            <div class="itabs">
                <template for:each={tabDefs} for:item="tab">
                    <div key={tab.id}
                         class={tab.cls}
                         data-tab={tab.id}
                         onclick={handleTabClick}>{tab.label}</div>
                </template>
            </div>

            <!-- ══ CONFIG TAB (AI + generic nodes) ══════════ -->
            <template lwc:if={showConfigTab}>

                <div class="prop-field">
                    <label class="prop-label">Node label</label>
                    <lightning-input
                        value={nodeTitle}
                        variant="label-hidden"
                        onchange={handleLabelChange}>
                    </lightning-input>
                </div>

                <!-- Engine credentials (AI nodes) -->
                <template lwc:if={isAiNode}>
                    <div class="prop-field">
                        <template lwc:if={canBindPicker}>
                            <c-ai-engine-connection-picker
                                engine-type={engineTypeForPicker}
                                agent-node-id={agentNodeRecordId}
                                selected-id={boundConnectionId}
                                onconfigchange={handlePickerConfigChange}>
                            </c-ai-engine-connection-picker>
                        </template>
                        <template lwc:else>
                            <div class="prop-sec-title">Credentials</div>
                            <div class="picker-blocked">{pickerBlockedMsg}</div>
                        </template>
                    </div>

                    <!-- Model radio cards -->
                    <div class="prop-field">
                        <label class="prop-label">Model</label>
                        <div class="engine-rows">
                            <template for:each={modelRows} for:item="m">
                                <div key={m.value}
                                     class={m.rowClass}
                                     data-value={m.value}
                                     onclick={handleModelSelect}>
                                    <span class={m.radioClass}></span>
                                    <div class={m.chipClass}>
                                        <lightning-icon icon-name="utility:einstein" size="xx-small"></lightning-icon>
                                    </div>
                                    <div class="er-text">
                                        <div class="er-name">{m.value}</div>
                                        <template lwc:if={m.hint}>
                                            <div class="er-hint">{m.hint}</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- ── If/Else condition builder — stacked rows, not a
                     cramped single line; the sidebar isn't wide enough to
                     hold left value + operator + right value legibly
                     side by side. ── -->
                <template lwc:if={isIfElseNode}>
                    <div class="prop-field">
                        <label class="prop-label">Condition</label>
                        <div class="cond-builder">
                            <div class="cond-row">
                                <span class="cond-row-label">Left side</span>
                                <div class="cond-side">
                                    <lightning-input
                                        value={conditionParts.lhs}
                                        variant="label-hidden"
                                        placeholder="\{!ai.score}"
                                        data-part="lhs"
                                        onchange={handleConditionLhsChange}>
                                    </lightning-input>
                                    <c-agent-variable-picker
                                        variables={availableVariables}
                                        data-part="lhs"
                                        onselect={handleInsertConditionToken}
                                        class="insert-btn">
                                    </c-agent-variable-picker>
                                </div>
                            </div>
                            <div class="cond-row">
                                <span class="cond-row-label">Operator</span>
                                <lightning-combobox
                                    value={conditionParts.op}
                                    options={conditionOperatorOptions}
                                    variant="label-hidden"
                                    class="cond-op"
                                    onchange={handleConditionOpChange}>
                                </lightning-combobox>
                            </div>
                            <div class="cond-row">
                                <span class="cond-row-label">Right side</span>
                                <div class="cond-side">
                                    <lightning-input
                                        value={conditionParts.rhs}
                                        variant="label-hidden"
                                        placeholder="80"
                                        data-part="rhs"
                                        onchange={handleConditionRhsChange}>
                                    </lightning-input>
                                    <c-agent-variable-picker
                                        variables={availableVariables}
                                        data-part="rhs"
                                        onselect={handleInsertConditionToken}
                                        class="insert-btn">
                                    </c-agent-variable-picker>
                                </div>
                            </div>
                        </div>
                        <div class="field-hint">Either side can be a plain value or a variable — click the merge-field icon to insert a record field, AI output, current user, or org value. Text values don't need quotes.</div>
                        <div class="field-hint">{ifElseScoreHint}</div>
                    </div>
                </template>

                <!-- ── Call a Tool (generic action node) ── -->
                <template lwc:if={isCallToolNode}>
                    <div class="prop-field">
                        <label class="prop-label">Tool source</label>
                        <lightning-combobox
                            value={callToolProvider}
                            options={callToolProviderOptions}
                            variant="label-hidden"
                            placeholder="Pick a source…"
                            onchange={handleCallToolProviderChange}>
                        </lightning-combobox>
                        <div class="field-hint">Your own Salesforce org's Apex actions and Flows need no connection. Gmail, Outlook, and other apps need to be connected first — see the Connectors directory.</div>
                    </div>

                    <template lwc:if={callToolProvider}>
                        <div class="prop-field">
                            <label class="prop-label">Tool type</label>
                            <lightning-combobox
                                value={callToolKind}
                                options={callToolKindOptions}
                                variant="label-hidden"
                                onchange={handleCallToolKindChange}>
                            </lightning-combobox>
                        </div>

                        <!-- Standard tool from the connector's live catalog -->
                        <template lwc:if={isCallToolStandard}>
                            <div class="prop-field">
                                <label class="prop-label">Tool</label>
                                <template lwc:if={callToolStandardLoading}>
                                    <div class="catalog-loading">
                                        <lightning-spinner alternative-text="Loading tools" size="small"></lightning-spinner>
                                        <p class="catalog-loading-text">Loading tools from the MCP server…</p>
                                    </div>
                                </template>
                                <template lwc:elseif={callToolStandardError}>
                                    <div class="picker-blocked">{callToolStandardError}</div>
                                </template>
                                <template lwc:else>
                                    <div class="tool-grid">
                                        <template for:each={callToolStandardRows} for:item="tool">
                                            <div key={tool.value}
                                                 class={tool.rowClass}
                                                 data-option={tool.value}
                                                 onclick={handleCallToolStandardSelect}>
                                                <span class={tool.checkClass}></span>
                                                <div class="tool-text">
                                                    <div class="tool-name">{tool.label}</div>
                                                    <template lwc:if={tool.description}>
                                                        <div class="tool-desc">{tool.description}</div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Custom Apex action / Flow -->
                        <template lwc:if={isCallToolCustom}>
                            <div class="prop-field">
                                <label class="prop-label">Action</label>
                                <template lwc:if={callToolCustomLoading}>
                                    <div class="catalog-loading">
                                        <lightning-spinner alternative-text="Loading actions" size="small"></lightning-spinner>
                                        <p class="catalog-loading-text">Loading Apex actions and Flows…</p>
                                    </div>
                                </template>
                                <template lwc:elseif={callToolCustomError}>
                                    <div class="picker-blocked">{callToolCustomError}</div>
                                </template>
                                <template lwc:else>
                                    <lightning-combobox
                                        value={callToolCustomValue}
                                        options={callToolCustomOptions}
                                        variant="label-hidden"
                                        placeholder="Pick an Apex action or Flow…"
                                        onchange={handleCallToolCustomSelect}>
                                    </lightning-combobox>
                                </template>
                            </div>
                        </template>

                        <!-- Schema-driven parameter fields -->
                        <template lwc:if={callToolParamFields.length}>
                            <div class="prop-field">
                                <label class="prop-label">Parameters</label>
                                <template for:each={callToolParamFields} for:item="p">
                                    <div key={p.key} class="param-row">
                                        <label class="prop-label param-row-label">{p.label}</label>
                                        <template lwc:if={p.isMultiline}>
                                            <div class="cond-side cond-side--top">
                                                <lightning-textarea value={p.value} variant="label-hidden" rows="2" data-param={p.key} onchange={handleCallToolParamChange}></lightning-textarea>
                                                <c-agent-variable-picker variables={availableVariables} data-key={p.key} onselect={handleInsertParamToken} class="insert-btn"></c-agent-variable-picker>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="cond-side">
                                                <lightning-input value={p.value} variant="label-hidden" data-param={p.key} onchange={handleCallToolParamChange}></lightning-input>
                                                <c-agent-variable-picker variables={availableVariables} data-key={p.key} onselect={handleInsertParamToken} class="insert-btn"></c-agent-variable-picker>
                                            </div>
                                        </template>
                                        <template lwc:if={p.description}>
                                            <div class="field-hint">{p.description}</div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={callToolNoParams}>
                            <div class="field-hint">This tool takes no parameters.</div>
                        </template>

                        <div class="prop-field">
                            <label class="prop-label">Output variable name (optional)</label>
                            <lightning-input
                                value={callToolOutputVariable}
                                variant="label-hidden"
                                placeholder="e.g. enrichmentData"
                                onchange={handleCallToolOutputVariableChange}>
                            </lightning-input>
                            <div class="field-hint">Name this call's result so later nodes can reference it, e.g. &#123;!enrichmentData.result.someField&#125; in a downstream AI node's instruction.</div>
                        </div>
                    </template>
                </template>

                <!-- Remaining schema-driven fields -->
                <template for:each={configFields} for:item="field">
                    <div key={field.key} class="prop-field">
                        <label class="prop-label">{field.label}</label>

                        <template lwc:if={field.isText}>
                            <div class="cond-side">
                                <lightning-input value={field.value} variant="label-hidden" placeholder={field.placeholder} data-key={field.key} onchange={handleFieldChange}></lightning-input>
                                <template lwc:if={field.supportsVariables}>
                                    <c-agent-variable-picker variables={availableVariables} data-key={field.key} onselect={handleInsertFieldToken} class="insert-btn"></c-agent-variable-picker>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={field.isTextarea}>
                            <div class="cond-side cond-side--top">
                                <lightning-textarea value={field.value} variant="label-hidden" placeholder={field.placeholder} max-length="10000" rows="4" data-key={field.key} onchange={handleFieldChange}></lightning-textarea>
                                <template lwc:if={field.supportsVariables}>
                                    <c-agent-variable-picker variables={availableVariables} data-key={field.key} onselect={handleInsertFieldToken} class="insert-btn"></c-agent-variable-picker>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={field.isNumber}>
                            <lightning-input type="number" value={field.value} variant="label-hidden" min={field.min} max={field.max} step={field.step} data-key={field.key} onchange={handleFieldChange}></lightning-input>
                        </template>
                        <template lwc:if={field.isPicklist}>
                            <lightning-combobox value={field.value} options={field.picklistOptions} variant="label-hidden" data-key={field.key} onchange={handleFieldChange}></lightning-combobox>
                        </template>
                        <template lwc:if={field.isToggle}>
                            <lightning-input type="toggle" checked={field.value} variant="label-hidden" message-toggle-active="Yes" message-toggle-inactive="No" data-key={field.key} onchange={handleFieldChange}></lightning-input>
                        </template>
                        <template lwc:if={field.isMultiselect}>
                            <div class="multiselect-rows">
                                <template for:each={field.multiselectOptions} for:item="opt">
                                    <label key={opt.value} class="ms-row">
                                        <input type="checkbox" checked={opt.checked} data-key={field.key} data-option={opt.value} onchange={handleMultiselectChange}/>
                                        <span class="ms-label">{opt.label}</span>
                                    </label>
                                </template>
                            </div>
                        </template>
                        <template lwc:if={field.isExamples}>
                            <div class="examples-box">
                                <template for:each={field.exampleRows} for:item="ex">
                                    <div key={ex.idx} class="example-row">
                                        <div class="example-head">
                                            <span class="ex-title">Example {ex.idxOneBased}</span>
                                            <lightning-button-icon icon-name="utility:close" size="x-small" variant="bare" alternative-text="Remove" data-key={field.key} data-idx={ex.idx} onclick={handleRemoveExample}></lightning-button-icon>
                                        </div>
                                        <lightning-textarea label="Input"  value={ex.input}  rows="2" max-length="2000" data-key={field.key} data-idx={ex.idx} data-which="input"  onchange={handleExampleChange}></lightning-textarea>
                                        <lightning-textarea label="Output" value={ex.output} rows="2" max-length="2000" data-key={field.key} data-idx={ex.idx} data-which="output" onchange={handleExampleChange}></lightning-textarea>
                                    </div>
                                </template>
                                <lightning-button label="+ Add example" data-key={field.key} onclick={handleAddExample}></lightning-button>
                            </div>
                        </template>

                        <template lwc:if={field.hint}>
                            <div class="field-hint">{field.hint}</div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- ══ VARIABLES TAB ════════════════════════════ -->
            <template lwc:if={showVarsTab}>
                <div class="vars-note">Reference — every field with a 🔤 icon on the Config tab can insert these directly.</div>
                <div class="var-list">
                    <template for:each={availableVariables} for:item="v">
                        <div key={v.token} class="var-card">
                            <code>{v.token}</code>
                            <span>{v.hint}</span>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ══ TOOLS TAB (catalog / connector nodes) ════ -->
            <template lwc:if={showToolsTab}>
                <div class="vars-note">Select which tools this node exposes to the AI</div>

                <template lwc:if={descriptionField}>
                    <div class="prop-field">
                        <label class="prop-label">{descriptionField.label}</label>
                        <lightning-textarea
                            value={descriptionField.value}
                            variant="label-hidden"
                            placeholder={descriptionField.placeholder}
                            rows="2"
                            data-key="description"
                            onchange={handleFieldChange}>
                        </lightning-textarea>
                    </div>
                </template>

                <template lwc:if={catalogLoading}>
                    <div class="catalog-loading">
                        <lightning-spinner alternative-text="Loading tools" size="small"></lightning-spinner>
                        <p class="catalog-loading-text">Loading tools from the MCP server…<br/>
                        First load can take up to a minute while the server wakes up.</p>
                    </div>
                </template>
                <template lwc:elseif={catalogError}>
                    <div class="picker-blocked">
                        <p>Could not load tools from the MCP server.</p>
                        <p class="catalog-error-detail">{catalogError}</p>
                        <lightning-button label="Retry" variant="brand" onclick={handleCatalogRetry}></lightning-button>
                    </div>
                </template>
                <template lwc:else>
                    <div class="tool-grid">
                        <template for:each={toolRows} for:item="tool">
                            <div key={tool.value}
                                 class={tool.rowClass}
                                 data-option={tool.value}
                                 onclick={handleToolRowToggle}>
                                <span class={tool.checkClass}></span>
                                <div class="tool-text">
                                    <div class="tool-name">{tool.label}</div>
                                    <template lwc:if={tool.description}>
                                        <div class="tool-desc">{tool.description}</div>
                                    </template>
                                </div>
                                <template lwc:if={tool.showBadge}>
                                    <span class={tool.badgeClass}>{tool.badgeLabel}</span>
                                </template>
                            </div>
                        </template>
                    </div>
                    <template lwc:if={noTools}>
                        <div class="picker-blocked">No tools available. Bind a connector on the Auth tab first.</div>
                    </template>
                </template>

                <!-- ── Custom tools (org's own Apex actions / Flows) ── -->
                <template lwc:if={supportsCustomTools}>
                    <div class="custom-tools-sec">
                        <div class="custom-tools-head">
                            <span class="custom-tools-title">Custom tools</span>
                            <lightning-button label="+ Add custom tool" onclick={handleOpenCustomToolPicker}></lightning-button>
                        </div>
                        <template lwc:if={hasCustomTools}>
                            <div class="tool-grid">
                                <template for:each={customToolRows} for:item="ct">
                                    <div key={ct.key} class="tool-row tool-row--on">
                                        <span class="tool-check tool-check--on"></span>
                                        <div class="tool-text">
                                            <div class="tool-name">{ct.label}</div>
                                            <div class="tool-desc">{ct.name}</div>
                                        </div>
                                        <span class="tool-badge tool-badge--write">{ct.typeLabel}</span>
                                        <lightning-button-icon icon-name="utility:delete" variant="bare" size="small"
                                            alternative-text="Remove" data-key={ct.key} onclick={handleRemoveCustomTool}></lightning-button-icon>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="custom-tools-empty">Expose your org's own Apex actions and Flows to this agent — schemas load live from the org.</div>
                        </template>
                    </div>
                </template>
                <template lwc:if={showCustomToolPicker}>
                    <c-agent-custom-tool-picker
                        selected={selectedCustomTools}
                        onaddtool={handleAddCustomTool}
                        onclose={handleCloseCustomToolPicker}>
                    </c-agent-custom-tool-picker>
                </template>
            </template>

            <!-- ══ AUTH TAB (catalog / connector nodes) ═════ -->
            <template lwc:if={showAuthTab}>
                <template lwc:if={authPinned}>
                    <div class="auth-ok">
                        <lightning-icon icon-name="utility:success" size="xx-small"></lightning-icon>
                        <span>Connected via OAuth · credentials active</span>
                    </div>
                    <div class="prop-field">
                        <label class="prop-label">Connected as</label>
                        <div class="fl-val">{pinnedConnectorAccount}</div>
                    </div>
                    <div class="prop-field">
                        <label class="prop-label">Provider</label>
                        <div class="fl-val">{authPinned.displayName}</div>
                    </div>
                    <template lwc:if={mcpServer}>
                        <div class="prop-field">
                            <label class="prop-label">MCP server</label>
                            <div class="fl-val fl-val--accent">{mcpServer}</div>
                        </div>
                    </template>
                    <lightning-button
                        variant="brand"
                        label="Re-authenticate"
                        icon-name="utility:refresh"
                        onclick={handleConnectProviderClick}
                        title="Run the OAuth flow again — refreshes expired tokens or switches the connected account"
                        class="full-width-btn connect-btn-space">
                    </lightning-button>
                    <lightning-button
                        label="Change connector"
                        icon-name="utility:switch"
                        onclick={handleChangeConnector}
                        class="full-width-btn">
                    </lightning-button>
                </template>
                <template lwc:else>
                    <div class="alert-w">
                        <lightning-icon icon-name="utility:warning" size="xx-small"></lightning-icon>
                        <span>No account connected — authenticate {providerDisplayName} to activate this node.</span>
                    </div>
                    <template lwc:if={isSalesforceMcpAuth}>
                        <div class="field-hint">
                            This isn't a different Salesforce org — it's a separate one-time login so the Salesforce tool server (a standalone process, not this Archon server) can call back into THIS org on the agent's behalf. Archon Setup authorizes the Archon server itself; this authorizes the tool server. Click Connect and log in as normal — it takes a few seconds.
                        </div>
                    </template>
                    <lightning-button
                        variant="brand"
                        label={connectButtonLabel}
                        icon-name="utility:add"
                        onclick={handleConnectProviderClick}
                        class="full-width-btn connect-btn-space">
                    </lightning-button>
                    <template lwc:if={hasConnectorOptions}>
                        <div class="prop-field">
                            <label class="prop-label">Or pick an existing connection</label>
                            <lightning-combobox
                                value={boundConnectorIdValue}
                                options={connectorOptions}
                                variant="label-hidden"
                                data-key="connectorId"
                                onchange={handleFieldChange}>
                            </lightning-combobox>
                        </div>
                    </template>
                </template>
            </template>

        </div>

        <!-- Footer -->
        <div class="prop-footer">
            <lightning-button
                variant="brand"
                label="Test this node"
                icon-name="utility:apex"
                onclick={handleTestNode}
                class="full-width-btn">
            </lightning-button>
        </div>

    </div>
</template>
