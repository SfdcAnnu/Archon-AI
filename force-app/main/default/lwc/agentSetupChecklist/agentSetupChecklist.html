<template>
    <template lwc:if={open}>
        <div class="asc-backdrop" onclick={handleClose}></div>
        <section role="dialog" aria-modal="true" aria-labelledby="asc-heading" class="asc-modal" onclick={stop}>
            <header class="asc-head">
                <h2 id="asc-heading">Setup checklist</h2>
                <lightning-button-icon icon-name="utility:close" size="small" variant="bare" alternative-text="Close" onclick={handleClose}></lightning-button-icon>
            </header>
            <div class="asc-body">
                <div class="asc-note">This agent was AI-generated as a Draft — it won't run anything until you finish these and activate it.</div>
                <template lwc:if={allDone}>
                    <div class="asc-all-done">All set — nothing outstanding.</div>
                </template>
                <template for:each={rows} for:item="r">
                    <div key={r.index} class={r.rowClass}>
                        <div class="asc-row-main" data-idx={r.index} onclick={handleToggle}>
                            <span class="asc-check"></span>
                            <lightning-icon icon-name={r.icon} size="x-small" class="asc-icon"></lightning-icon>
                            <div class="asc-text">
                                <div class="asc-title">{r.title}</div>
                                <div class="asc-desc">{r.description}</div>
                                <div class="asc-category">{r.categoryLabel}</div>
                            </div>
                        </div>
                        <div class="asc-note-wrap" onclick={stop}>
                            <lightning-textarea
                                label="Notes"
                                variant="label-hidden"
                                placeholder="Add a note about this item — what you did, or why it doesn't apply…"
                                value={r.notes}
                                data-idx={r.index}
                                onchange={handleNoteChange}>
                            </lightning-textarea>
                        </div>
                    </div>
                </template>
            </div>
            <footer class="asc-foot">
                <lightning-button variant="brand" label="Done" onclick={handleClose}></lightning-button>
            </footer>
        </section>
    </template>
</template>
