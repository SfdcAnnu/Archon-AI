<template>
    <div class="test-shell">
        <div class="test-header">
            <lightning-button-icon icon-name="utility:back" alternative-text="Back" onclick={handleBack}></lightning-button-icon>
            <span class="test-title">Test runner — {agentName}</span>
            <div class="spacer"></div>
            <lightning-badge label="Sandbox"></lightning-badge>
        </div>

        <div class="test-body">

            <!-- CONFIG PANEL -->
            <div class="test-config">

                <div class="test-card">
                    <div class="card-head">Test configuration</div>
                    <div class="card-body">
                        <div class="tf">
                            <label class="tf-label">Agent</label>
                            <lightning-input value={agentApi} disabled variant="label-hidden"></lightning-input>
                        </div>
                        <div class="tf">
                            <label class="tf-label">Salesforce record ID</label>
                            <lightning-input
                                value={recordId}
                                variant="label-hidden"
                                placeholder="Paste any Lead, Case or Opp ID…"
                                onchange={handleRecordId}>
                            </lightning-input>
                        </div>
                        <div class="tf">
                            <label class="tf-label">Run mode</label>
                            <lightning-combobox
                                value={runMode}
                                options={runModeOptions}
                                variant="label-hidden"
                                onchange={handleRunMode}>
                            </lightning-combobox>
                        </div>
                        <div class="tf">
                            <label class="tf-label">Extra input JSON (optional)</label>
                            <lightning-textarea
                                value={inputPayload}
                                variant="label-hidden"
                                rows="4"
                                placeholder={payloadPlaceholder}
                                onchange={handlePayload}>
                            </lightning-textarea>
                        </div>
                        <lightning-button
                            variant="brand"
                            label={runButtonLabel}
                            icon-name="utility:apex"
                            disabled={isDisabled}
                            onclick={handleRun}
                            class="run-btn">
                        </lightning-button>
                    </div>
                </div>

            </div>

            <!-- RESULTS PANEL -->
            <div class="test-results">
                <div class="test-card">
                    <div class="card-head">
                        Execution log
                        <template lwc:if={result}>
                            <lightning-badge
                                label={resultBadgeLabel}
                                class={resultBadgeClass}>
                            </lightning-badge>
                            <span class="elapsed">{result.elapsed}s</span>
                        </template>
                    </div>
                    <div class="log-body">
                        <template for:each={logs} for:item="log">
                            <div key={log.id} class="log-line">
                                <span class="log-ts">{log.ts}</span>
                                <span class={log.msgClass}>{log.message}</span>
                            </div>
                        </template>

                        <template lwc:if={isRunning}>
                            <lightning-spinner alternative-text="Running" size="small"></lightning-spinner>
                        </template>
                    </div>
                </div>

                <!-- RESULT BOX -->
                <template lwc:if={result}>
                    <div class="result-box">
                        <div class="result-score">
                            {result.agentScore}
                            <span class="score-max">/ 100</span>
                        </div>
                        <div class="score-bar-wrap">
                            <div style={scoreBarStyle}></div>
                        </div>
                        <div class="result-grid">
                            <div class="rg-row">
                                <span class="rg-key">Priority</span>
                                <span class="rg-val" style={priorityStyle}>{result.agentPriority}</span>
                            </div>
                            <div class="rg-row">
                                <span class="rg-key">Status</span>
                                <span class="rg-val">{result.agentStatus}</span>
                            </div>
                            <div class="rg-row">
                                <span class="rg-key">Correlation ID</span>
                                <span class="rg-val rg-mono">{result.correlationId}</span>
                            </div>
                        </div>
                        <template lwc:if={result.agentReason}>
                            <div class="result-reason">{result.agentReason}</div>
                        </template>
                    </div>
                </template>

            </div>
        </div>
    </div>
</template>
