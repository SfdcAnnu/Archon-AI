<template>
    <span class="avp-wrap">
        <lightning-button-icon
            class="avp-trigger"
            icon-name="utility:merge_field"
            size="small"
            variant="border-filled"
            alternative-text="Insert a field or variable"
            onclick={handleToggle}>
        </lightning-button-icon>

        <template lwc:if={open}>
            <div class="avp-backdrop" onclick={close}></div>
            <div class="avp-popover" style={popoverStyle} onclick={stop}>
                <div class="avp-search-row">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        placeholder="Search fields and variables…"
                        value={search}
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
                <div class="avp-list">
                    <template lwc:if={hasResults}>
                        <template for:each={filteredGroups} for:item="g">
                            <div key={g.label} class="avp-group">
                                <div class="avp-group-label">{g.label}</div>
                                <template for:each={g.items} for:item="v">
                                    <div key={v.token} class="avp-item" data-token={v.token} onclick={handleItemClick}>
                                        <div class="avp-item-token">{v.token}</div>
                                        <div class="avp-item-hint">{v.hint}</div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                    <template lwc:else>
                        <div class="avp-empty">No matches.</div>
                    </template>
                </div>
            </div>
        </template>
    </span>
</template>
