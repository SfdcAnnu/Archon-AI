<template>
    <div class={pickerStateClass}>
        <!-- ── State banner (color rail + status pill) ─────── -->
        <div class="state-banner">
            <div class="state-body">
                <lightning-icon icon-name={stateIcon} size="x-small" class="state-icon"></lightning-icon>
                <div class="state-labels">
                    <div class="state-title">{stateTitle}</div>
                    <div class="state-sub">{stateSub}</div>
                </div>
            </div>
            <lightning-button-icon
                icon-name="utility:add"
                variant="border-filled"
                size="small"
                alternative-text="Add key"
                title="Add a new API key"
                onclick={handleAddNew}
                class="add-btn">
            </lightning-button-icon>
        </div>

        <!-- ── Loading skeleton ──────────────────────────────── -->
        <template lwc:if={loading}>
            <div class="skeleton"></div>
        </template>

        <!-- ── State: needs selection (dropdown) ─────────────── -->
        <template lwc:if={showSelectPrompt}>
            <div class="select-wrap">
                <lightning-combobox
                    variant="label-hidden"
                    label="Credential"
                    placeholder="Choose an API key…"
                    options={comboOptions}
                    value={selectedId}
                    onchange={handleComboChange}>
                </lightning-combobox>
            </div>
        </template>

        <!-- ── State: bound credential ───────────────────────── -->
        <template lwc:if={hasBound}>
            <div class="bound-card">
                <div class="bound-body">
                    <div class="bound-name">{boundLabel}</div>
                    <div class="bound-meta">
                        <span class={boundBadgeClass}>{boundOwnership}</span>
                        <template lwc:if={boundModel}>
                            <span class="meta-dot">·</span>
                            <span class="meta-model">{boundModel}</span>
                        </template>
                    </div>
                </div>
                <div class="bound-actions">
                    <lightning-button-icon
                        icon-name="utility:switch"
                        alternative-text="Change"
                        title="Change credential"
                        size="small"
                        variant="bare"
                        onclick={handleChange}>
                    </lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:threedots_vertical"
                        alternative-text="More actions"
                        title="More"
                        size="small"
                        variant="bare"
                        onclick={handleToggleMenu}>
                    </lightning-button-icon>
                </div>

                <template lwc:if={menuOpen}>
                    <div class="menu-pop" onclick={handleMenuClick}>
                        <button type="button" class="menu-item" data-action="test">
                            <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                            Test connection
                        </button>
                        <template lwc:if={boundIsMine}>
                            <button type="button" class="menu-item" data-action="edit">
                                <lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>
                                Edit key
                            </button>
                            <button type="button" class="menu-item menu-danger" data-action="delete">
                                <lightning-icon icon-name="utility:delete" size="xx-small"></lightning-icon>
                                Delete
                            </button>
                        </template>
                        <div class="menu-divider"></div>
                        <button type="button" class="menu-item" data-action="unbind">
                            <lightning-icon icon-name="utility:erase" size="xx-small"></lightning-icon>
                            Unbind from node
                        </button>
                    </div>
                </template>
            </div>

            <template lwc:if={changeOpen}>
                <div class="change-pop">
                    <div class="change-head">
                        <span>Switch credential</span>
                        <button type="button" class="pop-close" onclick={handleCloseChange} aria-label="Close">×</button>
                    </div>
                    <template for:each={changeOptions} for:item="opt">
                        <button key={opt.id}
                                type="button"
                                class={opt.rowClass}
                                data-id={opt.id}
                                onclick={handleSwitchTo}>
                            <span class={opt.dotClass}></span>
                            <span class="opt-body">
                                <span class="opt-name">{opt.label}</span>
                                <span class="opt-meta">
                                    <span class={opt.badgeClass}>{opt.ownershipType}</span>
                                    <template lwc:if={opt.defaultModel}>
                                        <span class="meta-dot">·</span>
                                        <span>{opt.defaultModel}</span>
                                    </template>
                                </span>
                            </span>
                        </button>
                    </template>
                </div>
            </template>
        </template>

        <!-- ── Form modal (create/edit) ──────────────────────── -->
        <template lwc:if={showForm}>
            <c-ai-engine-connection-form
                engine-type={engineType}
                record-id={editRecordId}
                onsaved={handleFormSaved}
                oncancel={handleFormCancel}>
            </c-ai-engine-connection-form>
        </template>
    </div>
</template>
