<template>
    <div class="chat-shell">

        <!-- Top bar -->
        <header class="topbar">
            <h1 class="topbar-title">Archon Chat</h1>
            <div class="spacer"></div>
            <lightning-button
                label="+ New chat"
                variant="brand"
                icon-name="utility:chat"
                onclick={openAgentPicker}>
            </lightning-button>
        </header>

        <!-- Body: sidebar + main -->
        <div class="body">

            <!-- LEFT — sessions sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section-label">Recent</div>
                <template lwc:if={loadingSessions}>
                    <div class="sidebar-loading"><lightning-spinner size="small" alternative-text="Loading"></lightning-spinner></div>
                </template>
                <template lwc:elseif={hasSessions}>
                    <ul class="sess-list">
                        <template for:each={sessionItems} for:item="s">
                            <li key={s.id}
                                class={s.cssClass}
                                data-id={s.id}
                                data-apiname={s.agentApiName}
                                onclick={handlePickSession}>
                                <div class="sess-title">{s.title}</div>
                                <div class="sess-sub">{s.subtitle}</div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <div class="sidebar-empty">
                        No chats yet.<br/>Click <b>+ New chat</b> to start.
                    </div>
                </template>
            </aside>

            <!-- RIGHT — chat panel -->
            <main class="main">
                <template lwc:if={hasActiveSession}>
                    <c-synapse-chat-panel
                        agent-api-name={activeAgentApiName}
                        session-id={activeSessionId}
                        show-header="true"
                        onsessionchange={handleSessionChange}>
                    </c-synapse-chat-panel>
                </template>
                <template lwc:else>
                    <div class="empty-main">
                        <div class="empty-illust">
                            <lightning-icon icon-name="utility:chat" size="medium" alternative-text="Start chatting"></lightning-icon>
                        </div>
                        <h2>Pick an agent to start chatting</h2>
                        <p>Click <b>+ New chat</b> above to choose one of your chat-enabled agents, or open a recent session from the left.</p>
                    </div>
                </template>
            </main>
        </div>

        <!-- Agent picker modal -->
        <template lwc:if={showPicker}>
            <div class="picker-backdrop" onclick={closePicker}></div>
            <section role="dialog" aria-modal="true" class="picker-modal">
                <header class="picker-head">
                    <h3>Pick an agent</h3>
                    <lightning-button-icon
                        icon-name="utility:close"
                        size="small"
                        variant="bare"
                        alternative-text="Close"
                        onclick={closePicker}>
                    </lightning-button-icon>
                </header>
                <div class="picker-body">
                    <lightning-input
                        type="search"
                        label="Filter"
                        variant="label-hidden"
                        placeholder="Search by name or department…"
                        value={agentFilter}
                        onchange={handleFilterChange}>
                    </lightning-input>

                    <template lwc:if={loadingAgents}>
                        <div class="agent-loading">
                            <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:else>
                        <ul class="agent-list">
                            <template for:each={agents} for:item="a">
                                <li key={a.apiName}
                                    class="agent-item"
                                    data-apiname={a.apiName}
                                    onclick={handlePickAgent}>
                                    <div class="agent-name">{a.name}</div>
                                    <div class="agent-meta">
                                        <span>{a.department}</span>
                                        <template lwc:if={a.description}>
                                            <span> · {a.description}</span>
                                        </template>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
            </section>
        </template>
    </div>
</template>
