<template>
    <div class="chat-panel">

        <!-- Header -->
        <header class="chat-header">
            <span class="chat-title">{headerLabel}</span>
            <div class="spacer"></div>
            <lightning-button
                label="End"
                icon-name="utility:close"
                onclick={handleEnd}
                variant="destructive-text"
                class="end-btn">
            </lightning-button>
        </header>

        <!-- Message list -->
        <div class="msg-list">
            <template lwc:if={loading}>
                <div class="msg-loading">
                    <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={hasMessages}>
                <template for:each={displayedMessages} for:item="m">
                    <div key={m.id} class={m.cssClass}>
                        <!-- User -->
                        <template lwc:if={m.isUser}>
                            <div class="bubble bubble-user">{m.content}</div>
                        </template>

                        <!-- Assistant -->
                        <template lwc:if={m.isAssist}>
                            <div class="bubble bubble-asst">
                                <div class="role-tag">Assistant</div>
                                <div class="content chat-md"
                                     lwc:dom="manual"
                                     data-md-id={m.id}></div>
                            </div>
                        </template>

                        <!-- Tool call trace (informational — Managed MCP already executed it) -->
                        <template lwc:if={m.isTool}>
                            <div class="bubble bubble-tool">
                                <template lwc:if={m.toolLabel}>
                                    <div class="tool-head">⚙ {m.toolLabel}</div>
                                </template>
                                <div class="tool-body">{m.content}</div>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- Typing indicator: assistant is thinking -->
            <template lwc:if={showTypingIndicator}>
                <div class="msg msg-assistant">
                    <div class="bubble bubble-asst typing-bubble">
                        <div class="role-tag">Assistant</div>
                        <div class="typing-dots" aria-label="Assistant is typing">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </template>

            <template lwc:if={sessionEndedNotice}>
                <div class="ended-notice">{sessionEndedNotice}</div>
            </template>

            <template lwc:if={showEmptyHint}>
                <div class="msg-empty">Start the conversation by typing below.</div>
            </template>
        </div>

        <!-- Input area -->
        <footer class="chat-footer">
            <!-- File preview chips -->
            <template lwc:if={hasPendingAttachments}>
                <div class="attach-strip">
                    <template for:each={pendingAttachments} for:item="a">
                        <div key={a.id} class="attach-chip">
                            <template lwc:if={a.isImage}>
                                <img src={a.previewUrl} alt={a.name} class="attach-thumb"/>
                            </template>
                            <template lwc:else>
                                <lightning-icon icon-name="doctype:pdf" size="small" class="attach-icon"></lightning-icon>
                            </template>
                            <span class="attach-name" title={a.name}>{a.name}</span>
                            <button type="button" class="attach-remove" data-id={a.id} onclick={handleRemoveAttachment} title="Remove">×</button>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={needsConnection}>
                <div class="connect-card">
                    <lightning-icon icon-name="utility:lock" size="small" alternative-text="Connect"></lightning-icon>
                    <div class="connect-text">
                        <b>Connect your Salesforce account to start chatting.</b>
                        <span>This agent runs with your own access — it only sees and changes what you can.</span>
                    </div>
                    <lightning-button
                        variant="brand"
                        label={connectButtonLabel}
                        disabled={connectPolling}
                        onclick={handleConnectMyAccount}>
                    </lightning-button>
                </div>
            </template>
            <div class="input-row" lwc:else>
                <!-- File picker: hidden native input, custom button triggers it -->
                <input type="file"
                       lwc:ref="fileInput"
                       class="file-input-hidden"
                       accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,text/csv,text/markdown"
                       multiple
                       onchange={handleFilesPicked} />
                <lightning-button-icon
                    icon-name="utility:attach"
                    variant="border-filled"
                    alternative-text="Attach file"
                    onclick={handleAttachClick}
                    disabled={attachDisabled}
                    class="attach-btn"
                    title="Attach image, PDF, or text file">
                </lightning-button-icon>

                <textarea
                    lwc:ref="inputBox"
                    class="msg-input"
                    placeholder="Type a message…"
                    disabled={inputDisabled}
                    onchange={handleInputChange}
                    oninput={handleInputChange}
                    onkeydown={handleKeyDown}
                    rows="2">
                </textarea>

                <!-- Voice input -->
                <template lwc:if={voiceSupported}>
                    <lightning-button-icon
                        icon-name={micIcon}
                        variant={micVariant}
                        alternative-text={micLabel}
                        onclick={handleMicClick}
                        disabled={micDisabled}
                        class={micClass}
                        title={micLabel}>
                    </lightning-button-icon>
                </template>

                <lightning-button-icon
                    icon-name="utility:send"
                    variant="brand"
                    alternative-text="Send"
                    disabled={sendDisabled}
                    onclick={handleSend}
                    class="send-btn">
                </lightning-button-icon>
            </div>
        </footer>
    </div>
</template>
