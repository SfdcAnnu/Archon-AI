<template>
    <div class="setup-shell">
        <header class="setup-head">
            <h1 class="setup-title">Archon Setup</h1>
            <p class="setup-sub">Connect your Salesforce org and your AI providers — everything Archon needs before you build an agent.</p>
        </header>

        <div class="setup-tabs">
            <div class={salesforceTabClass} onclick={handleTabSalesforce}>
                <lightning-icon icon-name="utility:salesforce1" size="x-small"></lightning-icon>
                <span>Salesforce Setup</span>
            </div>
            <div class={aiTabClass} onclick={handleTabAi}>
                <lightning-icon icon-name="utility:einstein" size="x-small"></lightning-icon>
                <span>AI Provider Setup</span>
            </div>
        </div>

        <!-- ══ SALESFORCE SETUP ══════════════════════════════ -->
        <template lwc:if={isSalesforceTab}>
            <section class="card">
                <div class="card-row">
                    <div class="card-meta">
                        <div class="card-label">Connection status</div>
                        <div class="card-value">
                            <span class={statusBadgeClass}>{statusLabel}</span>
                        </div>
                        <template lwc:if={configuredLine}>
                            <div class="card-acct">{configuredLine}</div>
                        </template>
                    </div>

                    <div class="card-actions">
                        <template lwc:if={loading}>
                            <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
                        </template>
                        <template lwc:elseif={status.configured}>
                            <lightning-button label="Re-authorize" onclick={handleAuthorize} disabled={authorizing}></lightning-button>
                            <lightning-button label="Reset"  variant="destructive-text" onclick={handleReset}></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button variant="brand" label="Authorize" icon-name="utility:identity" onclick={handleAuthorize} disabled={authorizing}></lightning-button>
                        </template>
                    </div>
                </div>

                <div class="explainer">
                    <h3>How it works</h3>
                    <ol>
                        <li>You click <b>Authorize</b> below.</li>
                        <li>You're redirected to Salesforce login → consent to the Archon Agent Platform app.</li>
                        <li>Salesforce sends the auth code to the Archon server.</li>
                        <li>The server exchanges it for access + refresh tokens and stores them in its database for this org.</li>
                        <li>You're redirected back here with a one-time pickup token; this page exchanges it for a long-lived session key that all future Apex callouts use.</li>
                    </ol>
                    <p class="explainer-foot">This authorizes the Archon server itself — most of the app runs on this. The standalone Salesforce tool server used by AI agents for CRM actions is a separate one-time login, set up per-agent under its Auth tab.</p>
                </div>
            </section>
        </template>

        <!-- ══ AI PROVIDER SETUP ═════════════════════════════ -->
        <template lwc:if={isAiTab}>
            <section class="card">
                <div class="card-row">
                    <div class="card-meta">
                        <div class="card-label">AI Engine Connections</div>
                        <div class="card-sub">Bring your own key per provider. Agents and chat use whichever connection resolves for the running user — see the badges below.</div>
                    </div>
                    <div class="card-actions">
                        <lightning-button variant="brand" label="Add Connection" icon-name="utility:add" onclick={handleAddConnection}></lightning-button>
                    </div>
                </div>

                <template lwc:if={connectionsLoading}>
                    <div class="ai-loading"><lightning-spinner size="small" alternative-text="Loading"></lightning-spinner></div>
                </template>
                <template lwc:elseif={noConnections}>
                    <div class="ai-empty">
                        <p>No AI Engine Connections yet. Add one for each provider you plan to use — Claude, OpenAI, and Gemini all need their own key. There is no shared default key.</p>
                    </div>
                </template>
                <template lwc:else>
                    <div class="ai-list">
                        <template for:each={connectionRows} for:item="c">
                            <div key={c.id} class="ai-row">
                                <div class="ai-row-main">
                                    <div class="ai-row-top">
                                        <span class={c.engineBadgeClass}>{c.engineLabel}</span>
                                        <span class="ai-row-label">{c.label}</span>
                                        <template lwc:if={c.isPreferred}>
                                            <span class="chip chip-pref">Preferred</span>
                                        </template>
                                        <template lwc:if={c.isShared}>
                                            <span class="chip chip-shared">Shared</span>
                                        </template>
                                        <template lwc:elseif={c.isMine}>
                                            <span class="chip chip-personal">Personal — mine</span>
                                        </template>
                                        <template lwc:if={c.isInactive}>
                                            <span class="chip chip-inactive">Inactive</span>
                                        </template>
                                    </div>
                                    <div class="ai-row-sub">
                                        <span class={c.validationClass}>{c.validationLabel}</span>
                                        <template lwc:if={c.defaultModel}>
                                            <span class="ai-row-model">· {c.defaultModel}</span>
                                        </template>
                                    </div>
                                </div>
                                <div class="ai-row-actions">
                                    <lightning-button label="Test" data-id={c.id} onclick={handleTestConnection} disabled={c.testing}></lightning-button>
                                    <lightning-button label="Edit" data-id={c.id} onclick={handleEditConnection}></lightning-button>
                                    <lightning-button label="Delete" variant="destructive-text" data-id={c.id} onclick={handleDeleteConnection}></lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </section>
        </template>

        <template lwc:if={showConnectionForm}>
            <c-ai-engine-connection-form
                record-id={editingConnectionId}
                existing={editingConnectionSummary}
                onsaved={handleConnectionSaved}
                oncancel={handleConnectionFormCancel}>
            </c-ai-engine-connection-form>
        </template>
    </div>
</template>
